global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: infotrafic

scrape_configs:
  - job_name: serving
    metrics_path: /metrics
    static_configs:
      - targets: ["serving:8000"]
        labels:
          service: serving
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
