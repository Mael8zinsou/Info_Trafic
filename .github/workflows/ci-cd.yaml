name: infotrafic-train-equipe_solo1

on:
  push:
    branches: [ "Prod" ]
  pull_request:
    branches: [ "Prod" ]

jobs:
  train:
    name: Train models from samples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ETL on samples (preprod mode)
        env:
          ENV: preprod
        run: |
          python -m src.etl.app
          test -f data/processed/dataset_processed_current.csv
          echo "[OK] ETL produced dataset_processed_current.csv"

      - name: Train v1 (baseline)
        run: |
          python -m src.training.train
          test -f models/model_v1.joblib
          echo "[OK] model_v1.joblib trained"

      - name: Train v2 (anti-drift, with Etat arc)
        run: |
          python -m src.training.train_v2
          test -f models/model_v2.joblib
          echo "[OK] model_v2.joblib trained"

      - name: Compare models + update registry
        run: |
          python -m src.training.compare_models --dataset dataset_processed_current.csv
          test -f models/registry.json
          python -c "import json; r=json.load(open('models/registry.json')); print('v1 acc:', r['v1']['accuracy']); print('v2 acc:', r['v2']['accuracy'])"

      - name: Initialize active_model.json (default v1)
        run: |
          echo '{"active": "v1"}' > models/active_model.json
          cat models/active_model.json

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/model_v1.joblib
            models/model_v2.joblib
            models/registry.json
            models/active_model.json
            models/comparison_v1_v2.csv
            models/report_*.txt
          retention-days: 30

  build-and-push:
    name: Test + smoke + build Docker
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model artifacts from train job
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/

      - name: Verify artifacts retrieved
        run: |
          ls -la models/
          test -f models/model_v1.joblib
          test -f models/model_v2.joblib
          test -f models/registry.json
          echo "[OK] artifacts ready"

      - name: Quick sanity check (train.py exists)
        run: |
          test -f src/training/train.py
          test -f docker/Dockerfile.training

      - name: Run pytest (schemas + models + API)
        run: |
          pytest tests/ -v

      - name: Create .env for docker-compose
        run: |
          echo "SERVING_API_KEY=ci-smoke-key" > .env
          echo "[OK] .env créé pour docker-compose"

      - name: Smoke test - build serving container + curl /health
        run: |
          docker compose -p infotraf up -d --build serving
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' serving_container 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "[OK] serving healthy after $((i*2))s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "[FAIL] serving never became healthy"
              docker compose -p infotraf logs serving
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:8001/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"model_v1_loaded":true' /tmp/health.json
          grep -q '"model_v2_loaded":true' /tmp/health.json
          echo "[OK] smoke test passed"

      - name: Smoke test cleanup
        if: always()
        run: docker compose -p infotraf down -v || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.training
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/infotrafic-train-equipe_solo1:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/infotrafic-train-equipe_solo1:${{ github.sha }}

      - name: Staging (simulation)
        run: |
          echo "Déploiement staging simulé : image pushée, prête à être déployée."
